name: Daily bricks

on:
  schedule:
    # GitHub's scheduler often starts these hours late, so the NewsBrick service (worker/)
    # also triggers this workflow on time each morning. These are backups; a run that finds
    # today's edition already built exits right away without using any AI quota.
    # Odd minutes are less congested than the top of the hour.
    - cron: "17 9 * * *" # 3:17am Central (CST)
    - cron: "43 12 * * *" # 6:43am Central (CST)
  workflow_dispatch: # "Run workflow" button on GitHub, also used by the NewsBrick service
    inputs:
      force:
        description: "Rebuild today's edition even if it already exists"
        type: boolean
        default: false

permissions:
  contents: write # lets the job commit data/

concurrency:
  group: daily-bricks # never two runs at once

jobs:
  build-bricks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run build-bricks -- ${{ inputs.force && '--force' || '' }}
        working-directory: backend
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      - name: Commit today's bricks
        run: |
          git config user.name "newsbrick-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "Bricks for $(TZ=America/Chicago date +%F)"
          git push
